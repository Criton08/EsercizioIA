<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/utils.js"></script>
</head>
<body>
    <div class="header">
        <h2>📚 StudyBuddy</h2>
        <div>
            <span id="who"></span>
            <a href="stats.html">📊 Statistiche</a>
            <a href="#" onclick="logout()">Esci</a>
        </div>
    </div>

    <div class="container">
        <div class="box">
            <h3>Nuovo mazzo</h3>
            <input id="name" placeholder="Nome mazzo">
            <select id="materia">
                <option>Storia</option>
                <option>Scienze</option>
                <option>Inglese</option>
                <option>Informatica</option>
                <option>Matematica</option>
                <option>Altro</option>
            </select>
            <input id="desc" placeholder="Descrizione" style="width: 300px">
            <button class="btn" onclick="creaMazzo()">Crea</button>
            <p id="msgDeck" class="msg" role="status"></p>
        </div>

        <div class="box">
            <input id="q" placeholder="Cerca nelle carte..." style="width: 400px">
            <button class="btn" onclick="search()">Cerca</button>
            <div id="results"></div>
        </div>

        <h2>I tuoi mazzi</h2>
        <p id="msgDecks" class="msg" role="status"></p>
        <div id="decks" class="deck-list"></div>
    </div>

    <!-- easter egg: nearly invisible button in the bottom-right corner, shows a jumpscare when clicked -->
    <button id="secret" aria-label="secret" onclick="jumpscare()"
        style="position:fixed; right:6px; bottom:6px; width:14px; height:14px; padding:0; border:0; border-radius:50%; background:#888; opacity:0.04; cursor:default"></button>

    <script>
        checkLogin();

        // jumpscare: full screen face and a short loud noise, one click (or 2.5 s) closes it
        function jumpscare() {
            if (document.getElementById("scare")) return;

            var o = document.createElement("div");
            o.id = "scare";
            o.style.cssText = "position:fixed; inset:0; z-index:9999; background:#000; display:flex; align-items:center; justify-content:center; font-size:min(70vw,70vh); cursor:pointer";
            o.innerText = "👹";
            var close = function () { o.remove(); };
            o.onclick = close;
            document.body.appendChild(o);
            setTimeout(close, 2500);

            // noise made with the Web Audio API (no sound file needed); it only plays after the user's click
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(90, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } catch (e) { }
        }
        document.getElementById("who").innerText = "Ciao " + getUser().username;

        // loads the decks
        function loadDecks() {
            fetch("/api/decks").then(r => {
                // 401 is handled in utils.js (back to login); other errors must not be parsed as a deck list
                if (!r.ok) throw new Error("decks not loaded (" + r.status + ")");
                return r.json();
            }).then(data => {
                var html = "";
                for (var i = 0; i < data.length; i++) {
                    var d = data[i];
                    // the subject picks the colour of the card's tab; only known subjects go in the attribute,
                    // because escapeHtml does not escape quotes and the subject is free text
                    var subjects = ["Storia", "Scienze", "Inglese", "Informatica", "Matematica"];
                    var tab = subjects.indexOf(d.materia) >= 0 ? ' data-materia="' + d.materia + '"' : '';
                    html += '<div class="deck"' + tab + '>';
                    html += '<span class="materia">' + escapeHtml(d.materia) + (d.shared ? ' · condiviso' : '') + '</span>';
                    html += '<h3>' + escapeHtml(d.name) + '</h3>';
                    html += '<p>' + escapeHtml(d.descrizione || '') + '</p>';
                    html += '<p>' + d.numCarte + ' carte, ' + d.numDomande + ' domande</p>';
                    html += '<div class="deck-actions">';
                    html += '<a class="btn" href="study.html?deck=' + d.id + '">Studia</a>';
                    html += '<a class="btn btn-outline" href="quiz.html?deck=' + d.id + '">Quiz</a>';
                    // shared decks cannot be edited or deleted: the server answers 404 for them
                    if (!d.shared) {
                        html += '<a class="btn btn-outline" href="deck.html?id=' + d.id + '">Modifica</a>';
                        html += '<button class="btn-quiet-danger" onclick="eliminaMazzo(' + d.id + ', this)">Elimina</button>';
                    }
                    html += '</div></div>';
                }
                document.getElementById("decks").innerHTML = html;
            }).catch(() => {
                setMessage("msgDecks", "Mazzi non caricati: ricarica la pagina.", "error");
            });
        }

        // creates a new deck
        function creaMazzo() {
            var deck = {
                name: document.getElementById("name").value,
                materia: document.getElementById("materia").value,
                descrizione: document.getElementById("desc").value
            };
            if (deck.name.trim() == "") {
                setMessage("msgDeck", "Scrivi il nome del mazzo.", "error");
                document.getElementById("name").focus();
                return;
            }
            fetch("/api/decks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(deck)
            }).then(res => {
                if (res.status == 401) return; // utils.js is already taking the user back to the login page
                if (!res.ok) {
                    setMessage("msgDeck", "Mazzo non creato: nome fino a 100 caratteri, descrizione fino a 500.", "error");
                    return;
                }
                setMessage("msgDeck", "Mazzo \"" + deck.name.trim() + "\" creato.", "ok");
                document.getElementById("name").value = "";
                document.getElementById("desc").value = "";
                loadDecks();
            });
        }

        // deletes one of the user's own decks (with its cards and questions), after a confirmation in the card
        function eliminaMazzo(id, button) {
            var card = button.closest(".deck");
            var name = card.querySelector("h3").innerText;
            askConfirm(card, "Eliminare \"" + name + "\" con tutte le sue carte e domande? Non si può annullare.", "Sì, elimina", function () {
                fetch("/api/decks/" + id, { method: "DELETE" }).then(res => {
                    if (res.ok) setMessage("msgDecks", "Mazzo \"" + name + "\" eliminato.", "ok");
                    else setMessage("msgDecks", "Mazzo \"" + name + "\" non eliminato: ricarica la pagina e riprova.", "error");
                    loadDecks();
                });
            });
        }

        // search in the cards
        async function search() {
            const q = document.getElementById("q").value.trim();
            // an empty search would list every card: clear the results instead
            if (q == "") {
                document.getElementById("results").innerHTML = "";
                return;
            }
            const res = await fetch("/api/search?q=" + encodeURIComponent(q));
            if (!res.ok) {
                document.getElementById("results").innerHTML = "<p>Errore nella ricerca</p>";
                return;
            }
            const data = await res.json();
            let html = "<p>" + data.length + (data.length == 1 ? " risultato" : " risultati") + "</p>";
            data.forEach(r => {
                html += '<div class="card-row"><span><b>' + escapeHtml(r.front) + '</b> → ' + escapeHtml(r.back) + '</span><i>' + escapeHtml(r.deckName || '') + '</i></div>';
            });
            document.getElementById("results").innerHTML = html;
        }

        // Enter starts the search, Enter in the deck name creates the deck
        document.getElementById("q").addEventListener("keydown", e => { if (e.key == "Enter") search(); });
        document.getElementById("name").addEventListener("keydown", e => { if (e.key == "Enter") creaMazzo(); });

        loadDecks();
    </script>
</body>
</html>
