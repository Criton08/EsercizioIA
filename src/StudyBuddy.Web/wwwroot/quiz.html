<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy - Quiz</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 16px; /* keeps the options off the screen edges on a phone */
        }

        .option {
            box-sizing: border-box; /* width 100% plus padding would overflow */
        }

        .question {
            font-family: var(--font-display);
            font-size: 1.45rem;
            line-height: 1.3;
            color: var(--ink-dark);
            margin-bottom: 22px;
        }

        /* the options read like the answers on a written test: A, B, C, D */
        #quiz {
            counter-reset: option;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: var(--paper);
            border: 2px solid var(--line);
            border-radius: 6px;
            font: 1rem var(--font);
            color: var(--text);
            cursor: pointer;
        }

        .option::before {
            counter-increment: option;
            content: counter(option, upper-alpha);
            flex: none;
            width: 30px;
            height: 30px;
            border: 2px solid var(--ink);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            color: var(--ink);
        }

        .option:hover {
            border-color: var(--ink);
            background: #f3f6fd;
        }

        .option:hover::before {
            background: var(--highlight);
        }

        .progress {
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .score {
            font-family: var(--font-display);
            font-size: 4rem;
            font-weight: 800;
            color: var(--ink);
            text-align: center;
            line-height: 1;
            margin: 8px 0;
        }

        .detail {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-left: 5px solid var(--line);
            border-radius: 4px;
            margin-bottom: 8px;
            background: var(--paper);
        }

        .detail.ok { border-left-color: var(--green); }
        .detail.ko { border-left-color: var(--red); }
    </style>
</head>
<body>
    <div class="header">
        <h2>📚 StudyBuddy</h2>
        <div><a href="index.html">Home</a></div>
    </div>

    <div class="quiz-container">
        <div id="quiz">Caricamento...</div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
